# Render Blueprint — https://dashboard.render.com/blueprints
# GitHub 연결 후 "New Blueprint" → 이 repo 선택 → Apply

services:
  - type: web
    name: soriitda
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: MFDS_API_KEY
        sync: false
      - key: BASE_URL
        sync: false
