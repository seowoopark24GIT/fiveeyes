<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 — 소리잇다</title>
    <link rel="stylesheet" href="/static/css/theme.css">
</head>
<body>

<div class="app-shell">
    <header class="app-header">
        <a href="/" class="logo">소리잇다</a>
        <a href="/login" class="header-link">로그인</a>
    </header>

    <main class="app-main">
        <div class="page-section">
            <h2>회원가입</h2>
            <p class="desc">새 계정을 만드세요.</p>

            <form id="registerForm" method="post" action="/auth/register">
                <div class="field">
                    <label for="username">아이디</label>
                    <input id="username" type="text" name="username" required autocomplete="username" minlength="2">
                </div>
                <div class="field">
                    <label for="password">비밀번호</label>
                    <input id="password" type="password" name="password" required autocomplete="new-password" minlength="6">
                </div>
                <div class="field">
                    <label for="password_confirm">비밀번호 확인</label>
                    <input id="password_confirm" type="password" name="password_confirm" required autocomplete="new-password" minlength="6">
                </div>
            </form>

            {% set err = request.query_params.get('error') %}
            {% if err == 'exists' %}
                <p class="error-text">이미 사용 중인 아이디입니다.</p>
            {% elif err == 'mismatch' %}
                <p class="error-text">비밀번호가 일치하지 않습니다.</p>
            {% elif err == 'short' %}
                <p class="error-text">비밀번호는 6자 이상이어야 합니다.</p>
            {% elif err %}
                <p class="error-text">가입에 실패했습니다. 다시 시도해 주세요.</p>
            {% endif %}

            <p class="footer-link">이미 계정이 있으신가요? <a href="/login">로그인</a></p>
        </div>
    </main>

    <footer class="bottom-dock">
        <div class="cta-zone">
            <div class="cta-row">
                <button type="submit" form="registerForm" class="btn btn-accent">가입하기</button>
            </div>
        </div>
    </footer>
</div>

</body>
</html>
