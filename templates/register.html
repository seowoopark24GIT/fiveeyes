<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 — 소리잇다</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', sans-serif;
            background: #f3f4f6;
            color: #0d0d0d;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .app-shell {
            max-width: 480px;
            min-height: 100vh;
            margin: 0 auto;
            background: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            border-bottom: 1px solid #e5e5e5;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: #0d0d0d;
            text-decoration: none;
        }

        .topbar a.link {
            color: #6e6e80;
            text-decoration: none;
            font-size: 14px;
        }

        main { flex: 1; padding: 32px 16px 48px; }

        h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .desc {
            font-size: 14px;
            color: #6e6e80;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #6e6e80;
            margin-bottom: 6px;
        }

        .field { margin-bottom: 16px; }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }
        input:focus { border-color: #0d0d0d; }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            background: #0d0d0d;
            color: white;
            margin-top: 8px;
        }

        .error { color: #c53030; font-size: 13px; margin-top: 16px; }

        .footer-link {
            margin-top: 24px;
            font-size: 14px;
            color: #6e6e80;
            text-align: center;
        }
        .footer-link a { color: #0d0d0d; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>

<div class="app-shell">
    <div class="topbar">
        <a href="/" class="logo">소리잇다</a>
        <a href="/login" class="link">로그인</a>
    </div>

    <main>
        <h2>회원가입</h2>
        <p class="desc">새 계정을 만드세요.</p>

        <form method="post" action="/auth/register">
            <div class="field">
                <label for="username">아이디</label>
                <input id="username" type="text" name="username" required autocomplete="username" minlength="2">
            </div>
            <div class="field">
                <label for="password">비밀번호</label>
                <input id="password" type="password" name="password" required autocomplete="new-password" minlength="6">
            </div>
            <div class="field">
                <label for="password_confirm">비밀번호 확인</label>
                <input id="password_confirm" type="password" name="password_confirm" required autocomplete="new-password" minlength="6">
            </div>
            <button type="submit">가입하기</button>
        </form>

        {% set err = request.query_params.get('error') %}
        {% if err == 'exists' %}
            <p class="error">이미 사용 중인 아이디입니다.</p>
        {% elif err == 'mismatch' %}
            <p class="error">비밀번호가 일치하지 않습니다.</p>
        {% elif err == 'short' %}
            <p class="error">비밀번호는 6자 이상이어야 합니다.</p>
        {% elif err %}
            <p class="error">가입에 실패했습니다. 다시 시도해 주세요.</p>
        {% endif %}

        <p class="footer-link">이미 계정이 있으신가요? <a href="/login">로그인</a></p>
    </main>
</div>

</body>
</html>
