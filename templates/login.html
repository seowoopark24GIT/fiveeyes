<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 — 소리잇다</title>
    <link rel="stylesheet" href="/static/css/theme.css">
</head>
<body>

<div class="app-shell">
    <header class="app-header">
        <a href="/" class="logo">소리잇다</a>
        <a href="/register" class="header-link">회원가입</a>
    </header>

    <main class="app-main">
        <div class="page-section">
            <h2>로그인</h2>
            <p class="desc">계정 정보를 입력해 주세요.</p>

            <form id="loginForm" method="post" action="/auth/login">
                <div class="field">
                    <label for="username">아이디</label>
                    <input id="username" type="text" name="username" required autocomplete="username">
                </div>
                <div class="field">
                    <label for="password">비밀번호</label>
                    <input id="password" type="password" name="password" required autocomplete="current-password">
                </div>
            </form>

            {% if request.query_params.get('error') %}
                <p class="error-text">아이디 또는 비밀번호가 잘못되었습니다.</p>
            {% endif %}
            {% if request.query_params.get('registered') %}
                <p class="success-text">가입이 완료되었습니다. 로그인해 주세요.</p>
            {% endif %}

            <p class="footer-link">계정이 없으신가요? <a href="/register">회원가입</a></p>
        </div>
    </main>

    <footer class="bottom-dock">
        <div class="cta-zone">
            <div class="cta-row">
                <button type="submit" form="loginForm" class="btn btn-accent">로그인</button>
            </div>
        </div>
    </footer>
</div>

</body>
</html>
