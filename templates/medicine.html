<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ item_name }} — 의약품 안내</title>
<link rel="stylesheet" href="/static/css/theme.css">
<style>
.medicine-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 20px;
    padding-bottom: calc(var(--dock-height) + 16px);
    width: 100%;
}

.drug-title {
    font-size: 28px;
    font-weight: 600;
    text-align: center;
    color: var(--text);
    margin-top: 8px;
    line-height: 1.2;
    letter-spacing: -0.02em;
}
.drug-sub {
    font-size: 14px;
    color: var(--text-secondary);
    text-align: center;
    margin-top: 6px;
}

.voice-status {
    margin: 24px auto;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--border);
    cursor: pointer;
    transition: all 0.2s;
}
.voice-status.playing {
    border-color: var(--accent);
    box-shadow: 0 0 0 0 rgba(252, 228, 68, 0.35);
    animation: pulse 1.5s infinite;
}
.voice-status:focus-visible { outline: none; box-shadow: var(--focus-ring); }

@keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(252, 228, 68, 0.45); }
    70%  { box-shadow: 0 0 0 16px rgba(252, 228, 68, 0); }
    100% { box-shadow: 0 0 0 0 rgba(252, 228, 68, 0); }
}

.voice-icon { font-size: 20px; font-weight: 700; color: var(--accent); }
.voice-label {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 6px;
    font-weight: 600;
}

.now-speaking {
    width: 100%;
    min-height: 60px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    text-align: center;
    line-height: 1.5;
    margin-bottom: 20px;
}
.now-speaking.empty { color: var(--text-muted); font-weight: 400; font-size: 15px; }

.script-list {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
}

.script-item {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 18px;
    font-size: 15px;
    color: var(--text-secondary);
    line-height: 1.5;
    border: 1px solid var(--border);
    border-left: 3px solid transparent;
    transition: all 0.2s;
    opacity: 0.55;
}
.script-item.active {
    opacity: 1;
    border-left-color: var(--accent);
    color: var(--text);
    background: var(--gray-030);
}
.script-item.done { opacity: 0.35; }

.pill-image {
    width: 160px;
    height: 160px;
    object-fit: cover;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    margin-bottom: 16px;
}

.loading-overlay {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    margin: 40px 0;
}
.spinner {
    width: 48px;
    height: 48px;
    border: 4px solid var(--surface);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
}
</style>
</head>
<body>

<div class="app-shell">

<div class="sr-only" aria-live="polite" id="ariaLive"></div>

<header class="app-header">
    <span class="logo">소리잇다</span>
</header>

<main class="medicine-main">

{% if voice_script %}

<div class="drug-title" role="heading" aria-level="1">{{ item_name }}</div>
<div class="drug-sub" aria-label="의약품 음성 안내 페이지">화면을 탭하면 음성 안내가 시작됩니다</div>

{% if item_image %}
<img src="{{ item_image }}" class="pill-image" alt="{{ item_name }} 알약 이미지">
{% endif %}

<div
    class="voice-status"
    id="voiceStatus"
    onclick="togglePlay()"
    role="button"
    aria-label="음성 안내 재생"
    tabindex="0"
>
    <div class="voice-icon" id="voiceIcon">▶</div>
    <div class="voice-label" id="voiceLabel">탭하여 듣기</div>
</div>

<div class="now-speaking empty" id="nowSpeaking" aria-live="polite">
    버튼을 탭하면 음성 안내가 시작됩니다
</div>

<div class="script-list" id="scriptList" role="list">
{% for line in voice_script %}
    <div class="script-item" id="item-{{ loop.index0 }}" role="listitem">{{ line }}</div>
{% endfor %}
</div>

{% else %}

<div class="loading-overlay" role="status" aria-label="의약품 정보 불러오는 중">
    <div class="spinner"></div>
    <div style="color: var(--text-secondary); font-size: 16px;">의약품 정보를 분석하는 중입니다…</div>
    <div style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">잠시만 기다려주세요</div>
</div>

{% endif %}

</main>

{% if voice_script %}
<footer class="bottom-dock">
    <div class="cta-zone">
        <div class="cta-row">
            <button class="btn btn-accent" onclick="replay()" aria-label="처음부터 다시 듣기">처음부터 다시 듣기</button>
            <button class="btn btn-negative" onclick="togglePlay()" id="pauseBtn" aria-label="일시정지">일시정지</button>
        </div>
    </div>
</footer>
{% endif %}

</div>

<script>
const SCRIPT = {{ voice_script_json | safe }};
let idx = 0;
let isPlaying = false;
let isPaused = false;

function setIcon(playing) {
    document.getElementById('voiceIcon').textContent  = playing ? '▶' : '■';
    document.getElementById('voiceLabel').textContent = playing ? '재생 중' : '탭하여 듣기';
    document.getElementById('voiceStatus').classList.toggle('playing', playing);
    document.getElementById('pauseBtn').textContent   = playing ? '일시정지' : '재개';
}

function highlightItem(i) {
    document.querySelectorAll('.script-item').forEach((el, j) => {
        el.classList.remove('active', 'done');
        if (j < i) el.classList.add('done');
        if (j === i) el.classList.add('active');
    });

    const nowEl = document.getElementById('nowSpeaking');
    if (SCRIPT[i]) {
        nowEl.textContent = SCRIPT[i];
        nowEl.classList.remove('empty');
        document.getElementById('ariaLive').textContent = SCRIPT[i];
    }
}

function speakNext() {
    if (idx >= SCRIPT.length) {
        setIcon(false);
        isPlaying = false;
        document.getElementById('nowSpeaking').textContent = '안내가 완료되었습니다';
        document.querySelectorAll('.script-item').forEach(el => {
            el.classList.remove('active');
            el.classList.add('done');
        });
        return;
    }

    highlightItem(idx);
    const utter = new SpeechSynthesisUtterance(SCRIPT[idx]);
    utter.lang  = 'ko-KR';
    utter.rate  = 0.9;
    utter.pitch = 1.0;

    utter.onend = () => {
        idx++;
        if (!isPaused) setTimeout(speakNext, 600);
    };

    utter.onerror = (e) => {
        if (e.error !== 'interrupted') {
            idx++;
            setTimeout(speakNext, 600);
        }
    };

    window.speechSynthesis.speak(utter);
}

function play() {
    if (isPlaying && !isPaused) return;
    isPlaying = true;
    isPaused  = false;
    setIcon(true);
    if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
    } else {
        speakNext();
    }
}

function togglePlay() {
    if (!isPlaying) {
        play();
    } else if (!isPaused) {
        isPaused = true;
        window.speechSynthesis.pause();
        setIcon(false);
    } else {
        isPaused = false;
        window.speechSynthesis.resume();
        setIcon(true);
    }
}

function replay() {
    window.speechSynthesis.cancel();
    idx       = 0;
    isPlaying = false;
    isPaused  = false;
    document.querySelectorAll('.script-item').forEach(el => el.classList.remove('active','done'));
    setTimeout(play, 300);
}

window.addEventListener('load', () => {
    setTimeout(() => {
        if (SCRIPT.length > 0) play();
    }, 800);
});

document.getElementById('voiceStatus')?.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); togglePlay(); }
});
</script>
</body>
</html>
