<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소리잇다</title>
<link rel="stylesheet" href="/static/css/theme.css">
<style>
.page-section { padding: 20px; }
.page-section + .page-section { border-top: 1px solid var(--border); }
#result-section { display: none; }
.required { color: var(--danger); }

.drug-header {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    margin-bottom: 20px;
}

.drug-image {
    width: 88px;
    height: 88px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--surface);
}
.drug-image-placeholder {
    width: 88px;
    height: 88px;
    border-radius: 8px;
    border: 1px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 28px;
    color: var(--text-muted);
    background: var(--surface);
}

.drug-name {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
    letter-spacing: -0.02em;
}
.drug-shape {
    font-size: 12px;
    color: var(--accent-text);
    background: var(--accent);
    border: none;
    padding: 3px 10px;
    border-radius: 20px;
    display: inline-block;
    font-weight: 600;
}

.info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
}
@media (max-width: 500px) { .info-grid { grid-template-columns: 1fr; } }

.info-item label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
}
.info-item p {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

/* ── 수동 입력 ── */
.manual-panel {
    margin-top: 16px;
    padding: 16px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    background: var(--surface);
}
.manual-panel h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 12px;
}
.manual-panel .field-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
}
.manual-panel label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
}
.manual-panel input,
.manual-panel textarea {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    background: var(--surface);
}
.manual-panel input:focus,
.manual-panel textarea:focus { border-color: var(--text); }
.manual-panel textarea { resize: vertical; min-height: 60px; }
.btn-manual-confirm {
    width: 100%;
    padding: 12px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
}
.btn-manual-confirm:hover { background: var(--primary-hover); }

.braille-preview {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 20px;
    letter-spacing: 3px;
    margin-bottom: 4px;
    word-break: break-all;
}
.braille-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

/* ── 상태 ── */
.status-bar {
    display: none;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    margin-top: 12px;
    border: 1px solid var(--border);
}
.status-bar.success { background: var(--gray-020); color: var(--success); border-color: rgba(74, 222, 128, 0.35); }
.status-bar.error   { background: #2a1518; color: var(--danger); border-color: rgba(248, 113, 113, 0.35); }

.nfc-url { font-size: 13px; color: var(--text-secondary); word-break: break-all; margin-top: 6px; }
.nfc-url a { color: var(--accent); }

.hw-status { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.hw-badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--border);
}
.hw-ok  { background: var(--surface); color: var(--success); }
.hw-err { background: #2a1518; color: var(--danger); border-color: rgba(248, 113, 113, 0.35); }

/* ── 봉지약 ── */
.packet-form { display: flex; flex-direction: column; gap: 16px; }

.field-group label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
}

.field-input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    transition: border-color 0.15s;
}
.field-input:focus { border-color: var(--primary); box-shadow: var(--focus-ring); }
textarea.field-input { resize: vertical; min-height: 70px; }

.drug-list { display: flex; flex-direction: column; gap: 8px; }

.drug-row {
    display: grid;
    grid-template-columns: 1fr 70px auto auto;
    gap: 8px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
}

.drug-row input {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    background: var(--bg);
    font-family: inherit;
}
.drug-row input:focus { border-color: var(--primary); }

.btn-lookup {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
}
.btn-lookup:hover { background: var(--surface); }

.btn-remove {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text-secondary);
    font-size: 14px;
    cursor: pointer;
}
.btn-remove:hover { background: var(--surface); }

.drug-efficacy {
    grid-column: 1 / -1;
    font-size: 13px;
    color: var(--text-secondary);
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 6px;
    display: none;
}
.drug-efficacy.visible { display: block; }

.btn-add-drug {
    padding: 10px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    background: none;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    width: 100%;
    transition: all 0.15s;
}
.btn-add-drug:hover { border-color: var(--primary); color: var(--primary); background: rgba(31, 87, 231, 0.12); }

/* ── 카메라 ── */
#splashOverlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    cursor: pointer;
    gap: 24px;
    padding: 40px;
    text-align: center;
}
#splashOverlay .splash-logo {
    font-size: 40px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.02em;
}
#splashOverlay .splash-hint {
    font-size: 20px;
    color: var(--text-muted);
    line-height: 1.6;
}
#splashOverlay .splash-tap {
    margin-top: 16px;
    font-size: 16px;
    color: var(--accent-text);
    background: var(--accent);
    padding: 16px 40px;
    border-radius: 50px;
    font-weight: 600;
}

.voice-note-panel {
    display: none;
    flex-direction: column;
    gap: 20px;
    padding: 16px 0;
}
.ptt-area {
    width: 100%;
    min-height: 200px;
    background: var(--surface);
    border: 2px dashed var(--border);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--text-muted);
    cursor: pointer;
    user-select: none;
    touch-action: none;
    transition: background 0.15s, border-color 0.15s;
    text-align: center;
    padding: 24px;
    line-height: 1.6;
}
.ptt-area.recording {
    background: rgba(248, 200, 50, 0.12);
    border-color: var(--accent);
    color: var(--text);
    animation: ptt-pulse 1s ease-in-out infinite;
}
@keyframes ptt-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(248, 200, 50, 0.3); }
    50% { box-shadow: 0 0 0 12px rgba(248, 200, 50, 0); }
}
.voice-note-result {
    font-size: 16px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    min-height: 52px;
    line-height: 1.6;
    display: none;
}

.camera-wrap {
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1;
}
.camera-preview {
    width: calc(100% + 40px);
    margin: 0 -20px;
    flex: 1;
    min-height: 320px;
    max-height: 52vh;
    aspect-ratio: 3 / 4;
    border-radius: 0;
    background: #000;
    object-fit: cover;
    border: none;
}

.confirm-panel {
    display: none;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
    border-radius: var(--radius);
    background: var(--surface);
    border: 1px solid var(--border);
    margin-top: 12px;
}
.confirm-panel.visible { display: flex; }
.confirm-panel p { font-size: 14px; line-height: 1.6; color: var(--text-secondary); }

.voice-live {
    min-height: 20px;
    font-size: 13px;
    color: var(--accent);
    font-weight: 600;
}
</style>
</head>
<body>

<div class="app-shell">
<header class="app-header">
    <a href="/" class="logo">소리잇다</a>
</header>

<div id="splashOverlay" role="dialog" aria-modal="true" aria-label="시작 화면">
    <div class="splash-logo">소리잇다</div>
    <p class="splash-hint">물건을 카메라로 촬영하면<br>음성으로 정보를 알려드립니다</p>
    <div class="splash-tap">화면을 누르면 시작합니다</div>
</div>

<main class="app-main">
    <div class="page-section">
        <!-- 카메라 + 음성 확인 -->
        <div id="camera-mode">
            <h2>제품 촬영 · 음성 확인</h2>
            <p class="card-desc">
                웹캠으로 제품을 촬영하면 음성으로 설명합니다. 맞으면 바로 라벨을 출력합니다.
            </p>
            <div class="camera-wrap">
                <video id="cameraVideo" class="camera-preview" autoplay playsinline muted aria-label="웹캠 미리보기"></video>
                <canvas id="cameraCanvas" style="display:none" aria-hidden="true"></canvas>
                <div id="cameraStatus" class="status-bar"></div>
                <div id="voiceLive" class="voice-live" aria-live="polite"></div>
                <div id="confirmPanel" class="confirm-panel" role="region" aria-label="제품 확인">
                    <p id="confirmSummary">—</p>
                </div>
            </div>
        </div>

        <div id="voiceNotePanel" class="voice-note-panel">
            <div
                id="pttArea"
                class="ptt-area"
                aria-label="길게 눌러 음성 입력"
                role="button"
            >길게 누르는 동안 말씀해 주세요</div>
            <div id="voiceNoteResult" class="voice-note-result" aria-live="polite"></div>
        </div>

        <!-- 이름 검색 -->
        <div id="single-mode" style="display:none">
            <h2>제품 이름 검색</h2>
            <p class="card-desc">제품 이름을 입력한 뒤 하단 검색 버튼을 눌러 주세요.</p>
            <input
                id="searchInput"
                class="search-input"
                type="text"
                placeholder="예: 타이레놀, 게보린, 아스피린"
                autocomplete="off"
                aria-label="제품 이름"
            />
            <div id="searchStatus" class="status-bar"></div>
            <div id="manualPanel"></div>
        </div>

        <!-- 묶음 제품 -->
        <div id="packet-mode" style="display:none">
            <h2>묶음 제품 입력</h2>
            <div class="packet-form">
                <div class="field-group">
                    <label>묶음 라벨 <span class="required">*</span> (점자 출력용, 짧게)</label>
                    <input id="packetLabel" class="field-input" type="text" placeholder="예: 감기약, 혈압약" oninput="updatePacketBraille()" />
                </div>
                <div class="field-group">
                    <label>복용 시간대</label>
                    <input id="packetTiming" class="field-input" type="text" placeholder="예: 아침 식후, 점심 식후, 취침 전" />
                </div>
                <div class="field-group">
                    <label>전체 목적 <span class="required">*</span></label>
                    <textarea id="packetPurpose" class="field-input" placeholder="예: 감기 증상 완화를 위한 약이 들어있습니다"></textarea>
                </div>
                <div class="field-group">
                    <label>제품 목록 <span class="required">*</span></label>
                    <div class="drug-list" id="drugList"></div>
                    <button type="button" class="btn-add-drug" onclick="addDrugRow()">+ 제품 추가</button>
                </div>
                <div class="field-group">
                    <label>추가 주의사항 (선택)</label>
                    <textarea id="packetCaution" class="field-input" placeholder="예: 임산부는 복용 전 의사와 상담하세요"></textarea>
                </div>

                <div class="braille-label">점자 미리보기</div>
                <div class="braille-preview" id="packetBraillePreview">라벨을 입력하세요</div>
                <div id="packetStatus" class="status-bar"></div>
            </div>
        </div>
    </div>

    <div class="page-section" id="result-section">
        <h2>제품 정보</h2>

        <div class="drug-header">
            <div id="drugImageWrap"></div>
            <div>
                <div class="drug-name" id="drugName">—</div>
                <div class="drug-shape" id="drugShape">형태 정보 없음</div>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <label>효능·효과</label>
                <p id="efcyQesitm">—</p>
            </div>
            <div class="info-item">
                <label>복용방법</label>
                <p id="useMethodQesitm">—</p>
            </div>
            <div class="info-item">
                <label>주의사항</label>
                <p id="atpnWarnQesitm">—</p>
            </div>
            <div class="info-item">
                <label>부작용</label>
                <p id="seQesitm">—</p>
            </div>
        </div>

        <div class="braille-label">점자 미리보기</div>
        <div class="braille-preview" id="braillePreview">—</div>
        <div id="generateStatus" class="status-bar"></div>
    </div>
</main>

<footer class="bottom-dock" role="contentinfo">
    <div class="cta-zone">
        <div id="ctaCamera" class="cta-row">
            <button class="btn btn-accent" id="captureBtn" onclick="captureAndIdentify()" aria-label="촬영하고 식별하기">촬영</button>
            <button class="btn btn-negative" id="retakeBtn" onclick="resetCameraFlow()" aria-label="다시 촬영">다시 찍기</button>
        </div>
        <div id="ctaConfirm" class="cta-row hidden">
            <button class="btn btn-accent" id="confirmYesBtn" onclick="confirmIdentification(true)" aria-label="맞음, 출력하기">맞음</button>
            <button class="btn btn-negative" id="confirmNoBtn" onclick="confirmIdentification(false)" aria-label="틀림, 다시 찍기">다시</button>
        </div>
        <div id="ctaDone" class="cta-row hidden">
            <button class="btn btn-negative" id="doneRetakeBtn" onclick="resetCameraFlow()" aria-label="다시 촬영하기">다시</button>
        </div>
        <div id="ctaSingle" class="cta-row hidden">
            <button class="btn btn-primary" onclick="searchDrug()" aria-label="제품 검색">검색</button>
        </div>
        <div id="ctaGenerate" class="cta-row hidden">
            <button class="btn btn-accent" id="generateBtn" onclick="generateOutput()" disabled aria-label="점자 라벨과 NFC 출력">점자 라벨 출력 + NFC</button>
        </div>
        <div id="ctaPacket" class="cta-row hidden">
            <button class="btn btn-accent" id="packetGenerateBtn" onclick="generatePacket()" aria-label="묶음 라벨과 NFC 출력">묶음 라벨 출력 + NFC</button>
        </div>
    </div>
    <nav class="mode-tabs" role="tablist" aria-label="기능 선택">
        <button type="button" class="mode-tab active" id="tabCamera" role="tab" aria-selected="true" onclick="switchMode('camera')">촬영</button>
        <button type="button" class="mode-tab" id="tabSingle" role="tab" aria-selected="false" onclick="switchMode('single')">이름 검색</button>
        <button type="button" class="mode-tab" id="tabPacket" role="tab" aria-selected="false" onclick="switchMode('packet')">묶음 제품</button>
    </nav>
</footer>
</div>

<script>
let currentDrug = null;
let currentSearchQuery = null;  // 약사가 입력한 검색어 (점자 출력용)
let cameraStream = null;
let pendingIdentify = null;
let speechRecognition = null;
let isListening = false;
let isSpeaking = false;
let isVoiceNoteMode = false;
let outputDone = false;
let voiceNoteItemName = '';
let pttRecognition = null;
let pttFinalText = '';

// ── 카메라 + 음성 확인 ──────────────────────────────

async function initCamera() {
    if (cameraStream) return;
    try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' },
            audio: false,
        });
        document.getElementById('cameraVideo').srcObject = cameraStream;
    } catch (e) {
        showStatus('cameraStatus', 'error', '카메라를 사용할 수 없습니다. 브라우저 권한을 확인하세요.');
        speakText('카메라를 사용할 수 없습니다.');
    }
}

function stopCamera() {
    if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
    }
}

function resetCameraFlow() {
    stopListening();
    pendingIdentify = null;
    outputDone = false;
    document.getElementById('confirmPanel').classList.remove('visible');
    hideStatus('generateStatus');
    updateBottomCta();
    hideStatus('cameraStatus');
    setVoiceLive('');
    document.getElementById('captureBtn').disabled = false;
    initCamera();
    speakText('다시 촬영해 주세요.');
}

async function enterVoiceNoteMode(itemName) {
    isVoiceNoteMode = true;
    voiceNoteItemName = itemName;
    pendingIdentify = null;
    document.getElementById('confirmPanel').classList.remove('visible');
    document.getElementById('cameraWrap') && (document.getElementById('cameraWrap').style.display = 'none');
    document.querySelector('.camera-wrap').style.display = 'none';
    document.getElementById('voiceNotePanel').style.display = 'flex';
    document.getElementById('voiceNoteResult').style.display = 'none';
    document.getElementById('voiceNoteResult').textContent = '';
    stopCamera();
    updateBottomCta();
    await speakText('정보를 찾지 못했습니다. 직접 말씀해 주세요.');
    await speakText('화면을 길게 누르면 음성으로 입력됩니다.');
}

function resetVoiceNoteMode() {
    isVoiceNoteMode = false;
    voiceNoteItemName = '';
    pttFinalText = '';
    document.getElementById('voiceNotePanel').style.display = 'none';
    document.querySelector('.camera-wrap').style.display = '';
    updateBottomCta();
    initCamera();
}

function startPTT() {
    if (pttRecognition) return;
    window.speechSynthesis.cancel();
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
        speakText('음성 인식을 지원하지 않는 브라우저입니다.');
        return;
    }
    pttFinalText = '';
    pttRecognition = new SR();
    pttRecognition.lang = 'ko-KR';
    pttRecognition.interimResults = true;
    pttRecognition.continuous = true;

    pttRecognition.onresult = (e) => {
        pttFinalText = Array.from(e.results).map(r => r[0].transcript).join('');
        const resultEl = document.getElementById('voiceNoteResult');
        resultEl.style.display = 'block';
        resultEl.textContent = pttFinalText;
    };

    let pttErrorMsg = '';
    pttRecognition.onerror = (e) => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
            pttErrorMsg = '마이크 권한이 꺼져 있습니다. 브라우저 설정에서 마이크를 허용해 주세요.';
        } else if (e.error === 'no-speech') {
            pttErrorMsg = '음성이 감지되지 않았습니다. 더 길게, 더 크게 말씀해 주세요.';
        } else {
            pttErrorMsg = `음성 인식 오류(${e.error})가 발생했습니다.`;
        }
    };

    pttRecognition.onend = async () => {
        pttRecognition = null;
        document.getElementById('pttArea').classList.remove('recording');
        if (pttFinalText.trim()) {
            await saveVoiceNote(pttFinalText.trim());
        } else {
            const msg = pttErrorMsg || '입력된 내용이 없습니다. 다시 길게 눌러 말씀해 주세요.';
            const resultEl = document.getElementById('voiceNoteResult');
            resultEl.style.display = 'block';
            resultEl.textContent = msg;
            await speakText(msg);
        }
    };

    pttRecognition.start();
    document.getElementById('pttArea').classList.add('recording');
}

}

async function captureAndIdentify() {
    const video = document.getElementById('cameraVideo');
    const canvas = document.getElementById('cameraCanvas');
    if (!cameraStream) {
        await initCamera();
        if (!cameraStream) return;
    }

    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const imageBase64 = canvas.toDataURL('image/jpeg', 0.85);

    document.getElementById('captureBtn').disabled = true;
    document.getElementById('confirmPanel').classList.remove('visible');
    showStatus('cameraStatus', 'loading', '제품을 분석 중입니다...');
    setVoiceLive('분석 중...');
    speakText('제품을 분석 중입니다.');

    try {
        const res = await fetch('/pharmacist/identify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image_base64: imageBase64 }),
        });

        if (!res.ok) {
            let detail = '식별에 실패했습니다.';
            try {
                const err = await res.json();
                detail = typeof err.detail === 'string'
                    ? err.detail
                    : Array.isArray(err.detail)
                        ? err.detail.map(d => d.msg || d).join(', ')
                        : detail;
            } catch (_) {}
            showStatus('cameraStatus', 'error', detail);
            speakText(detail + ' 다시 촬영해 주세요.');
            document.getElementById('captureBtn').disabled = false;
            return;
        }

        pendingIdentify = await res.json();
        hideStatus('cameraStatus');

        const summary = (pendingIdentify.voiceScript || []).join(' ');
        document.getElementById('confirmSummary').textContent = summary;
        document.getElementById('confirmPanel').classList.add('visible');
        updateBottomCta();

        await speakScript(pendingIdentify.voiceScript || []);
        startListening();
    } catch (e) {
        showStatus('cameraStatus', 'error', '서버 오류: ' + e.message);
        speakText('서버 오류입니다. 다시 촬영해 주세요.');
        document.getElementById('captureBtn').disabled = false;
    }
}

async function confirmIdentification(isYes) {
    stopListening();
    if (!pendingIdentify) return;

    if (!isYes) {
        resetCameraFlow();
        return;
    }

    // 공식 데이터도 없고 화장품 AI 추정 정보도 없을 때만 수동 음성 입력으로 이동
    if (!pendingIdentify.verified && !pendingIdentify.aiGuessAvailable) {
        enterVoiceNoteMode(pendingIdentify.shortLabel || pendingIdentify.product?.itemName || '');
        return;
    }

    const product = pendingIdentify.product || {};
    currentDrug = product;
    currentSearchQuery = pendingIdentify.shortLabel || product.itemName || '';
    renderResult(product);
    speakText('확인되었습니다. 라벨을 출력합니다.');
    setVoiceLive('출력 중...');
    pendingIdentify = null;
    outputDone = true;
    document.getElementById('confirmPanel').classList.remove('visible');
    updateBottomCta();
    generateOutput();
}

function setVoiceLive(msg) {
    document.getElementById('voiceLive').textContent = msg || '';
}

function speakText(text) {
    return new Promise(resolve => {
        if (!window.speechSynthesis) { resolve(); return; }
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'ko-KR';
        utter.rate = 0.95;
        utter.onend = () => resolve();
        utter.onerror = () => resolve();
        window.speechSynthesis.speak(utter);
    });
}

function speakScript(sentences) {
    return new Promise(resolve => {
        if (!window.speechSynthesis || !sentences.length) { resolve(); return; }
        window.speechSynthesis.cancel();
        isSpeaking = true;
        let idx = 0;

        const speakNext = () => {
            if (idx >= sentences.length) {
                isSpeaking = false;
                setVoiceLive('음성 확인을 기다리는 중입니다.');
                resolve();
                return;
            }
            const utter = new SpeechSynthesisUtterance(sentences[idx]);
            utter.lang = 'ko-KR';
            utter.rate = 0.95;
            setVoiceLive(sentences[idx]);
            utter.onend = () => { idx++; setTimeout(speakNext, 400); };
            utter.onerror = () => { idx++; setTimeout(speakNext, 400); };
            window.speechSynthesis.speak(utter);
        };
        speakNext();
    });
}

function stopListening() {
    if (speechRecognition && isListening) {
        try { speechRecognition.stop(); } catch (_) {}
    }
    isListening = false;
}

function startListening() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        setVoiceLive('음성 인식을 지원하지 않습니다. 버튼을 사용해 주세요.');
        return;
    }

    stopListening();
    speechRecognition = new SpeechRecognition();
    speechRecognition.lang = 'ko-KR';
    speechRecognition.interimResults = false;
    speechRecognition.maxAlternatives = 3;
    isListening = true;

    speechRecognition.onresult = (event) => {
        const heard = Array.from(event.results)
            .map(r => r[0].transcript.trim())
            .join(' ')
            .toLowerCase();
        if (/맞|예|yes|출력|확인/.test(heard) && !/다시|아니|틀/.test(heard)) {
            confirmIdentification(true);
        } else if (/다시|아니|틀|no/.test(heard)) {
            confirmIdentification(false);
        }
    };

    speechRecognition.onerror = () => { isListening = false; };
    speechRecognition.onend = () => {
        if (isListening && pendingIdentify && !isSpeaking) {
            try { speechRecognition.start(); } catch (_) {}
        }
    };

    try { speechRecognition.start(); } catch (_) {}
}

function setText(id, value) {
    // 80자 이내 첫 문장만 표시 (나머지는 CSS line-clamp로 추가 제한)
    document.getElementById(id).textContent = value ? firstSentence(value, 80) : '정보 없음';
}

function firstSentence(text, maxLen) {
    if (!text) return '';
    // HTML 태그 및 반복 공백 제거
    const clean = text.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    if (clean.length <= maxLen) return clean;
    // 한국어 문장 끝 패턴: 다./요./세요./시오. 등 (공백 불필요)
    const m = clean.match(/^[\s\S]{1,200}?[다요세니오]\./)
    if (m && m[0].length <= maxLen * 2) return m[0];
    // 첫 문장이 너무 길면 maxLen에서 공백 기준으로 절단
    const cut = clean.slice(0, maxLen);
    const lastSpace = cut.lastIndexOf(' ');
    return (lastSpace > maxLen * 0.5 ? cut.slice(0, lastSpace) : cut) + '…';
}

function trimText(text, max) {
    return text.length > max ? text.slice(0, max) + '…' : text;
}

let currentMode = 'camera';

function updateBottomCta() {
    const confirmVisible = document.getElementById('confirmPanel').classList.contains('visible');
    const resultVisible = document.getElementById('result-section').style.display !== 'none';

    document.getElementById('ctaCamera').classList.toggle('hidden', currentMode !== 'camera' || confirmVisible || isVoiceNoteMode || outputDone);
    document.getElementById('ctaConfirm').classList.toggle('hidden', currentMode !== 'camera' || !confirmVisible || isVoiceNoteMode || outputDone);
    document.getElementById('ctaDone').classList.toggle('hidden', currentMode !== 'camera' || !outputDone);
    document.getElementById('ctaSingle').classList.toggle('hidden', currentMode !== 'single' || resultVisible);
    document.getElementById('ctaGenerate').classList.toggle('hidden', currentMode !== 'single' || !resultVisible);
    document.getElementById('ctaPacket').classList.toggle('hidden', currentMode !== 'packet');
}

function switchMode(mode) {
    currentMode = mode;
    const isCamera = mode === 'camera';
    const isSingle = mode === 'single';
    document.getElementById('camera-mode').style.display = isCamera ? '' : 'none';
    document.getElementById('single-mode').style.display = isSingle ? '' : 'none';
    document.getElementById('packet-mode').style.display = (!isCamera && !isSingle) ? '' : 'none';
    document.getElementById('tabCamera').classList.toggle('active', isCamera);
    document.getElementById('tabSingle').classList.toggle('active', isSingle);
    document.getElementById('tabPacket').classList.toggle('active', !isCamera && !isSingle);
    document.getElementById('tabCamera').setAttribute('aria-selected', isCamera);
    document.getElementById('tabSingle').setAttribute('aria-selected', isSingle);
    document.getElementById('tabPacket').setAttribute('aria-selected', !isCamera && !isSingle);

    if (isCamera) {
        initCamera();
    } else {
        stopCamera();
        outputDone = false;
        document.getElementById('confirmPanel').classList.remove('visible');
        hideStatus('generateStatus');
    }

    if (!isSingle) {
        document.getElementById('result-section').style.display = 'none';
    } else if (currentDrug) {
        document.getElementById('result-section').style.display = 'block';
    }

    updateBottomCta();
}

function removeDrugRow(idx) {

async function lookupDrug(idx) {
    const row = document.getElementById(`drugRow-${idx}`);
    const name = row.querySelector('.drug-name-input').value.trim();
    if (!name) return alert('제품 이름을 입력하세요.');

    const btn = row.querySelector('.btn-lookup');
    btn.textContent = '조회 중...';
    btn.disabled = true;

    try {
        const res = await fetch('/pharmacist/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ item_name: name }),
        });

        if (!res.ok) {
            showPacketManualForm(idx, name);
            return;
        }

        const drug = await res.json();
        // "이 약은 " 접두사 제거 후 25자까지만 저장 (봉지약 음성 스크립트용 짧은 요약)
        const rawEfcy = (drug.efcyQesitm || '').replace(/^이 약은\s*/,'').replace(/^이 약\s*/,'');
        const efficacy = rawEfcy ? firstSentence(rawEfcy, 25) : '';
        const caution = drug.atpnWarnQesitm ? firstSentence(drug.atpnWarnQesitm, 60) : '';

        row.dataset.itemSeq = drug.itemSeq || '';
        row.dataset.efficacy = efficacy;
        row.dataset.caution = caution;

        const efficacyEl = document.getElementById(`efficacy-${idx}`);
        efficacyEl.innerHTML = `효능: ${efficacy || '없음'}`;
        efficacyEl.classList.add('visible');
    } catch (e) {
        showPacketManualForm(idx, name);
    } finally {
        btn.textContent = '식약처 조회';
        btn.disabled = false;
    }
}

function showPacketManualForm(idx, name) {
    const efficacyEl = document.getElementById(`efficacy-${idx}`);
    efficacyEl.classList.add('visible');
    efficacyEl.innerHTML = `
        <div class="manual-panel" style="margin-top:0">
            <h3>식약처에서 찾을 수 없습니다 — 직접 입력</h3>
            <div class="field-row">
                <label>효능·효과 (짧게)</label>
                <input id="pManualEfcy-${idx}" type="text" placeholder="예: 통증과 열을 낮추는 약" />
            </div>
            <div class="field-row">
                <label>주의사항</label>
                <input id="pManualCaution-${idx}" type="text" placeholder="예: 공복 복용 금지" />
            </div>
            <button class="btn-manual-confirm" onclick="confirmPacketManual(${idx})">확인</button>

function confirmPacketManual(idx) {
    const row = document.getElementById(`drugRow-${idx}`);
    const efficacy = document.getElementById(`pManualEfcy-${idx}`).value.trim();
    const caution = document.getElementById(`pManualCaution-${idx}`).value.trim();
    row.dataset.efficacy = efficacy;
    row.dataset.caution = caution;
    row.dataset.itemSeq = '';

    const efficacyEl = document.getElementById(`efficacy-${idx}`);
    efficacyEl.innerHTML = `효능: ${efficacy || '없음'}`;
}

// ── 봉지약 점자 미리보기 ──────────────────────

async function updatePacketBraille() {
    const label = document.getElementById('packetLabel').value.trim();
    const el = document.getElementById('packetBraillePreview');
    if (!label) { el.textContent = '라벨을 입력하세요'; return; }
    try {
        const res = await fetch(`/pharmacist/braille-preview?text=${encodeURIComponent(label)}`);
        if (res.ok) {
            const data = await res.json();
            el.textContent = data.braille + '  ' + label;
        }
    } catch (_) {
        el.textContent = label;
    }
}

// ── 봉지약 생성 ──────────────────────────────

async function generatePacket() {
    const label = document.getElementById('packetLabel').value.trim();
    const purpose = document.getElementById('packetPurpose').value.trim();
    if (!label) { alert('묶음 라벨을 입력하세요.'); return; }
    if (!purpose) { alert('전체 목적을 입력하세요.'); return; }

    const rows = document.querySelectorAll('.drug-row');
    if (rows.length === 0) { alert('제품을 하나 이상 추가하세요.'); return; }

    const drugs = [];
    for (const row of rows) {
        const name = row.querySelector('.drug-name-input').value.trim();
        const count = parseInt(row.querySelector('.drug-count-input').value) || 1;
        if (!name) { alert('제품 이름이 비어있는 항목이 있습니다.'); return; }
        drugs.push({
            name,
            count,
            item_seq: row.dataset.itemSeq || null,
            efficacy: row.dataset.efficacy || null,
            caution: row.dataset.caution || null,
        });
    }

    const timing = document.getElementById('packetTiming').value.trim() || null;
    const extra_caution = document.getElementById('packetCaution').value.trim() || null;

    showStatus('packetStatus', 'loading', '묶음 라벨 출력 중 + NFC 태그 쓰는 중...');
    document.getElementById('packetGenerateBtn').disabled = true;

    try {
        const res = await fetch('/pharmacist/packet/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ label, purpose, timing, drugs, extra_caution }),
        });

        const data = await res.json();
        const printerLabel = data.printer_ok ? '점자 프린터 완료' : '점자 프린터 미연결';
        const nfcLabel = data.nfc_ok ? 'NFC 태그 완료' : 'NFC 태그 미연결';
        const preview = (data.voice_preview || []).map(s => `<li>${s}</li>`).join('');

        const statusHtml = `
            출력 완료
            <div class="hw-status">
                <span class="hw-badge ${data.printer_ok ? 'hw-ok' : 'hw-err'}">${printerLabel}</span>
                <span class="hw-badge ${data.nfc_ok ? 'hw-ok' : 'hw-err'}">${nfcLabel}</span>
            </div>
            <div class="nfc-url"><a href="${data.nfc_data}" target="_blank">${data.nfc_data}</a></div>
            ${preview ? `<ul style="margin-top:8px;font-size:13px;color:var(--text-secondary);padding-left:18px">${preview}</ul>` : ''}
        `;
        showStatusHtml('packetStatus', 'success', statusHtml);
    } catch (e) {
        showStatus('packetStatus', 'error', '출력 오류: ' + e.message);
    } finally {
        document.getElementById('packetGenerateBtn').disabled = false;
    }
}
</script>
